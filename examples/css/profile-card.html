<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile Card</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #eef2ff; display: flex; justify-content: center; padding: 2rem; }
    .card { background: white; border: 2px solid #4f46e5; border-radius: 12px; padding: 1.5rem; max-width: 320px; text-align: center; }
    .card h1 { color: #4f46e5; margin: 0 0 0.5rem; }
    .card p { color: #333; }
    .card button { background: #4f46e5; color: white; border: none; border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; }
    .card button:hover, .card button:focus-visible { background: #3730a3; outline: 3px solid #c7d2fe; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Asha Sharma</h1>
    <p>First-year engineer · loves space</p>
    <button type="button">Say hello</button>
  </div>
</body>
</html>
