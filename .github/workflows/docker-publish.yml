name: Publish hello-web to Docker Hub

on:
  push:
    tags:
      - "v*.*"
  workflow_dispatch:

env:
  IMAGE: focuslog/hello-web

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags (1.0 + latest)
        id: tags
        run: |
          # Tag pushes like v1.0 map to 1.0 + latest; manual runs default to latest.
          REF="${GITHUB_REF_NAME:-latest}"
          VER="${REF#v}"
          if [ "$VER" = "$REF" ] || [ -z "$VER" ]; then VER="1.0"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Tags: $VER and latest"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
            ${{ env.IMAGE }}:latest
          provenance: true
          sbom: true

      - name: Print digests
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.tags.outputs.version }}"
