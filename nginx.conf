worker_processes auto;
# Non-root runtime: keep pid + logs in writable /tmp
error_log /tmp/nginx_error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/nginx_access.log;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 5000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for a static classroom site
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Tutorial docs at /
    location / {
      try_files $uri $uri/ $uri/index.html =404;
    }

    # Runnable examples at /examples/... (real files copied at build time)
    location /examples/ {
      alias /usr/share/nginx/html/examples/;
      index index.html;
      try_files $uri $uri/ $uri/index.html =404;
    }

    # No directory auto-listings anywhere
    autoindex off;
  }
}
